<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio &amp; Contact — CandyGame Admin</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <div class="cg-admin-shell">
      <aside class="cg-admin-sidebar" data-cg-admin-sidebar>
        <div>
          <a href="./admin.html" class="cg-brand">
            <img src="./assets/aistudio/Candy_Team_Game_Studio_Logo_c7b30204.webp" alt="CandyGame" />
            <span>CandyGame</span>
          </a>
          <nav class="cg-admin-nav" aria-label="Admin navigation">
            <a href="./admin.html">Dashboard</a>
            <a href="./admin-games.html">Games</a>
            <a href="./admin-game-editor.html">Add / Edit Game</a>
            <a href="./admin-categories.html">Categories</a>
            <a href="./admin-downloads.html">Downloads &amp; Links</a>
            <a href="./admin-content.html">Website Content</a>
            <a href="./admin-studio-contact.html" class="active">Studio &amp; Contact</a>
            <a href="./admin-seo.html">SEO Settings</a>
            <a href="./admin-settings.html">General Settings</a>
          </nav>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.5rem;">
          <a href="./home.html" class="cg-btn cg-btn-secondary cg-btn-sm" style="width:100%;">View Public Site &rarr;</a>
          <button type="button" data-cg-admin-signout class="cg-btn cg-btn-danger cg-btn-sm" style="width:100%;">Sign Out</button>
        </div>
      </aside>

      <div class="cg-admin-content">
        <header class="cg-admin-topbar">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <button type="button" class="cg-menu-btn" data-cg-admin-menu-toggle aria-label="Open menu">&#9776;</button>
            <div>
              <h1 style="font-size:1.35rem;color:#fff;">Studio &amp; Contact Management</h1>
              <p style="font-size:0.8rem;color:var(--cg-on-surface-variant);">Manage CandyGame identity, contact channels, and social links</p>
            </div>
          </div>
        </header>

        <main class="cg-admin-main">
          <form class="cg-glass-card" data-cg-save-form="Studio profile" style="display:flex;flex-direction:column;gap:1.25rem;">
            <h2 style="font-size:1.25rem;color:#fff;">Studio Profile &amp; Contact</h2>
            <div class="cg-grid-2">
              <div class="cg-field">
                <label class="cg-label">Studio Name</label>
                <input class="cg-input" value="CandyGame" />
              </div>
              <div class="cg-field">
                <label class="cg-label">Studio Tagline</label>
                <input class="cg-input" value="Playful Worlds. Precision Mobile Craft." />
              </div>
              <div class="cg-field">
                <label class="cg-label">Primary Studio Email</label>
                <input type="email" class="cg-input" value="support@candygame.bond" />
              </div>
              <div class="cg-field">
                <label class="cg-label">Instagram URL</label>
                <input type="url" class="cg-input" value="https://www.instagram.com/candystudiogame?gwpx=ODJ6cWs0Z2owbDZk" />
              </div>
              <div class="cg-field">
                <label class="cg-label">YouTube URL</label>
                <input type="url" class="cg-input" value="https://www.youtube.com/channel/UCIkhGA6X_ynyBiJ4RP2W2GA" />
              </div>
              <div class="cg-field">
                <label class="cg-label">Google Play Developer URL</label>
                <input type="url" class="cg-input" placeholder="https://play.google.com/store/apps/dev?id=..." />
              </div>
            </div>
            <div class="cg-field">
              <label class="cg-label">Short Studio Bio</label>
              <textarea rows="2" class="cg-textarea">CandyGame is an independent mobile game development studio creating polished puzzle and casual experiences for Android players worldwide.</textarea>
            </div>
            <div style="display:flex;justify-content:flex-end;">
              <button type="submit" class="cg-btn cg-btn-primary">Save Changes</button>
            </div>
          </form>
        </main>
      </div>
    </div>

    <script src="./assets/main.js"></script>
  </body>
</html>
